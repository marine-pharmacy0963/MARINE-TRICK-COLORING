</style></head><body><div id="login" class="locked"><h2>🎨 MARINE COLORING MASTER</h2><p class="muted">管理パスワードを入力してください。</p><input id="pw" type="password" placeholder="パスワード" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px"><div class="row" style="margin-top:10px"><button class="pill primary" onclick="login()">ログイン</button><button class="pill" onclick="testLogin()">ログイン動作確認</button></div><p id="loginMsg" class="muted"></p></div>
<div id="app" hidden><header class="top"><b>🎨 MARINE COLORING MASTER</b><span id="saveState" class="saveDot">未保存</span><button class="pill" onclick="saveNow()">手動保存</button><button class="pill" onclick="logout()">ログアウト</button></header><main>
<div class="tabs"><button class="pill tab on" data-v="items">ぬりえ管理</button><button class="pill tab" data-v="design">デザイン</button><button class="pill tab" data-v="settings">基本設定</button><button class="pill tab" data-v="data">データ管理</button><button class="pill tab" data-v="preview">公開プレビュー</button></div>
<section id="items" class="view on panel"><div class="row"><h2 style="margin-right:auto">ぬりえ一覧</h2><button class="pill primary" onclick="addItem()">＋ 新規登録</button></div><div id="list"></div></section>
<section id="design" class="view panel"><h2>ページデザイン</h2><div class="grid"><div class="field"><label>ページタイトル</label><input id="pageTitle" oninput="syncSettings()"></div><div class="field"><label>背景色</label><input id="bgColor" type="color" oninput="syncSettings()"></div><div class="field"><label>ページ背景画像</label><input id="bgFile" type="file" accept="image/*" onchange="setBackground(this.files[0])"></div><div class="field"><label>背景表示</label><select id="bgMode" onchange="syncSettings()"><option value="cover">全面 cover</option><option value="contain">全体 contain</option><option value="repeat">繰り返し</option></select></div></div><div class="row" style="margin-top:10px"><button class="pill danger" onclick="removeBackground()">背景画像を削除</button><span class="muted">公開HTMLにも同期されます。</span></div></section>
<section id="settings" class="view panel"><h2>基本設定</h2><div class="grid"><div class="field"><label>管理パスワード</label><input id="password" type="password" onchange="syncSettings()"></div><div class="field"><label>自動保存</label><select id="autoSave" onchange="syncSettings()"><option value="1">ON</option><option value="0">OFF</option></select></div><div class="field"><label>最大画像解像度（長辺px）</label><input id="maxPx" type="number" min="600" max="4000" step="100" onchange="syncSettings()"></div><div class="field"><label>JPEG/WebP圧縮品質</label><input id="quality" type="number" min="0.4" max="1" step="0.05" onchange="syncSettings()"></div></div><p class="muted">PNGの透過は保持します。大きな画像は登録時に最大解像度へ縮小します。</p><p>最終更新: <b id="updated">-</b></p></section>
<section id="data" class="view panel"><h2>データ管理</h2><div class="row"><button class="pill" onclick="exportJSON()">JSON書き出し</button><label class="pill">JSON読み込み<input type="file" accept="application/json,.json" hidden onchange="importJSON(this.files[0])"></label><button id="publicExportBtn" class="pill primary" onclick="exportPublic()">圧縮版index.html書き出し</button></div><p class="muted">MASTERの保存はこのブラウザ内（localStorage）です。JSONをバックアップとして併用してください。公開HTMLは書き出し時だけ画像を軽量化します。</p><p id="exportStatus" class="muted"></p></section>

</main></div>
<div id="editModal" class="modal"><div class="modalbox"><h2 id="editHead">ぬりえ編集</h2><div class="grid"><div class="field"><label>名前 / タイトル</label><input id="eName"></div><div class="field"><label>公開</label><select id="ePublic"><option value="1">ON</option><option value="0">OFF</option></select></div><div class="field"><label>ぬりえ画像</label><input id="eMain" type="file" accept="image/*"></div><div class="field"><label>公開側 保存ボタン</label><select id="eSave"><option value="1">許可 ON</option><option value="0">OFF</option></select></div><div class="field"><label>見本画像（任意）</label><input id="eSample" type="file" accept="image/*"></div><div class="field"><label>見本の保存ボタン</label><select id="eSampleSave"><option value="0">OFF</option><option value="1">許可 ON</option></select></div></div><div class="row" style="margin-top:15px"><button class="pill primary" onclick="commitEdit()">保存</button><button class="pill" onclick="closeEdit()">キャンセル</button></div></div></div>
<script>
const KEY='marineColoringMaster_v1',DB_NAME='marineColoringMasterDB_v1',DB_STORE='master',DB_RECORD='state';let state={settings:{password:'3103',autoSave:true,maxPx:1800,quality:.86,pageTitle:'マリントリック ぬりえ',bgColor:'#eef9ff',bgImage:'',bgMode:'cover',updated:''},items:[]};let editing=-1,dragIndex=null;
function openMasterDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(DB_STORE))q.result.createObjectStore(DB_STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function dbRead(){let db=await openMasterDB();return new Promise((resolve,reject)=>{let q=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(DB_RECORD);q.onsuccess=()=>{db.close();resolve(q.result)};q.onerror=()=>{db.close();reject(q.error)}})}
async function dbWrite(value){let db=await openMasterDB();return new Promise((resolve,reject)=>{let tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(value,DB_RECORD);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error)}})}
async function load(){try{let saved=await dbRead();if(!saved){let old=localStorage.getItem(KEY);if(old)saved=JSON.parse(old)}if(saved&&saved.settings&&Array.isArray(saved.items))state=saved;if(state.settings.password==='marine')state.settings.password='3103';await dbWrite(state);try{localStorage.removeItem(KEY)}catch(e){}}catch(e){console.error(e);saveState.textContent='保存領域の読込に失敗'}hydrate();render()}
function hydrate(){password.value=state.settings.password;autoSave.value=state.settings.autoSave?'1':'0';maxPx.value=state.settings.maxPx;quality.value=state.settings.quality;pageTitle.value=state.settings.pageTitle;bgColor.value=state.settings.bgColor;bgMode.value=state.settings.bgMode;updated.textContent=state.settings.updated||'-'}
function login(){if(pw.value===state.settings.password){login.hidden=true;app.hidden=false;render()}else loginMsg.textContent='パスワードが違います。'}function testLogin(){loginMsg.innerHTML='ログインボタンは正常です。現在の設定パスワードとの一致時のみ管理画面を開きます。'}function logout(){app.hidden=true;login.hidden=false;pw.value=''}
function touch(){state.settings.updated=new Date().toLocaleString('ja-JP');updated.textContent=state.settings.updated;saveState.textContent='変更あり';if(state.settings.autoSave)saveNow()}async function saveNow(){saveState.textContent='保存中…';try{await dbWrite(state);saveState.textContent='保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){console.error(e);saveState.textContent='保存失敗';alert('画像データを保存できませんでした。JSONを書き出してバックアップしてください。')}}
function syncSettings(){Object.assign(state.settings,{password:password.value||'3103',autoSave:autoSave.value==='1',maxPx:+maxPx.value||1800,quality:+quality.value||.86,pageTitle:pageTitle.value||'ぬりえ',bgColor:bgColor.value,bgMode:bgMode.value});touch();renderPreview()}
async function imageData(file){if(!file)return null;const src=await fileToData(file),img=await loadImg(src),max=state.settings.maxPx||1800,s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let type=file.type==='image/png'?'image/png':'image/jpeg';return c.toDataURL(type,state.settings.quality||.86)}
function fileToData(f){return new Promise(r=>{let x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)})}function loadImg(s){return new Promise(r=>{let i=new Image;i.onload=()=>r(i);i.src=s})}
async function setBackground(f){if(!f)return;state.settings.bgImage=await imageData(f);touch();renderPreview()}function removeBackground(){state.settings.bgImage='';bgFile.value='';touch();renderPreview()}
function addItem(){editing=-1;eName.value='';ePublic.value='1';eSave.value='1';eSampleSave.value='0';eMain.value='';eSample.value='';editModal.classList.add('on')}
function editItem(i){editing=i;let x=state.items[i];eName.value=x.name;ePublic.value=x.public?'1':'0';eSave.value=x.save?'1':'0';eSampleSave.value=x.sampleSave?'1':'0';eMain.value='';eSample.value='';editModal.classList.add('on')}function closeEdit(){editModal.classList.remove('on')}
async function commitEdit(){let old=editing>=0?state.items[editing]:{main:'',sample:''};let main=eMain.files[0]?await imageData(eMain.files[0]):old.main,sample=eSample.files[0]?await imageData(eSample.files[0]):old.sample;if(!eName.value.trim())return alert('名前を入力してください');if(!main)return alert('ぬりえ画像を登録してください');let x={name:eName.value.trim(),public:ePublic.value==='1',save:eSave.value==='1',sampleSave:eSampleSave.value==='1',main,sample};if(editing>=0)state.items[editing]=x;else state.items.push(x);closeEdit();touch();render()}
async function del(i){let x=state.items[i];if(!x||!confirm('「'+x.name+'」を削除しますか？'))return;state.items.splice(i,1);state.settings.updated=new Date().toLocaleString('ja-JP');updated.textContent=state.settings.updated;render();await saveNow()}function dup(i){let x=structuredClone(state.items[i]);x.name+=' コピー';state.items.splice(i+1,0,x);touch();render()}
function render(){list.innerHTML=state.items.map((x,i)=>`<div class="item" draggable="true" ondragstart="dragIndex=${i}" ondragover="event.preventDefault()" ondrop="dropItem(${i})"><div class="handle">☰</div><img class="thumb" src="${x.main}"><div><b>${esc(x.name)}</b><div class="muted">${x.public?'公開':'非公開'} ・ 保存${x.save?'ON':'OFF'} ・ 見本${x.sample?'あり':'なし'}</div></div><div class="actions row"><button class="pill" onclick="editItem(${i})">編集</button><button class="pill" onclick="dup(${i})">複製</button><button class="pill danger" onclick="del(${i})">削除</button></div></div>`).join('')||'<p class="muted">まだぬりえがありません。「＋ 新規登録」から追加してください。</p>';renderPreview()}
function dropItem(i){if(dragIndex===null||dragIndex===i)return;let x=state.items.splice(dragIndex,1)[0];state.items.splice(i,0,x);dragIndex=null;touch();render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function galleryHTML(exporting=false){let s=state.settings,bg=s.bgImage?`url(${s.bgImage})`:'';return `<div class="preview" style="background-color:${s.bgColor};background-image:${bg};background-size:${s.bgMode==='repeat'?'auto':s.bgMode};background-repeat:${s.bgMode==='repeat'?'repeat':'no-repeat'}"><h1 style="text-align:center">${esc(s.pageTitle)}</h1><div class="gallery">${state.items.filter(x=>x.public).map((x,i)=>`<div class="card"><img src="${x.main}" alt="${esc(x.name)}"><h3>${esc(x.name)}</h3><div class="row" style="justify-content:center">${x.sample?`<button class="pill" onclick="showSample(${i})">見本を見る</button>`:''}${x.save?`<a class="pill primary" download="${esc(x.name)}.png" href="${x.main}" style="text-decoration:none">ぬりえを保存</a>`:''}</div></div>`).join('')}</div></div>`}function renderPreview(){publicPreview.innerHTML=galleryHTML()}
function showSampleByItem(x){let w=window.open('','_blank');w.document.write(`<title>${esc(x.name)} 見本</title><body style="margin:0;background:#eef;text-align:center;font-family:sans-serif"><h2>${esc(x.name)} 見本</h2><img src="${x.sample}" style="max-width:95vw;max-height:80vh"><br>${x.sampleSave?`<a download="${esc(x.name)}_見本.png" href="${x.sample}">見本を保存</a>`:''}</body>`)}function showSample(filteredIndex){let x=state.items.filter(x=>x.public)[filteredIndex];if(x&&x.sample)showSampleByItem(x)}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJSON(){download('MARINE_COLORING_DATA.json',JSON.stringify(state,null,2),'application/json')}
function importJSON(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!Array.isArray(x.items))throw 0;state=x;hydrate();touch();render();alert('読み込みました')}catch(e){alert('JSONを読み込めませんでした')}};r.readAsText(f)}
function dataBytes(src){if(!src)return 0;let p=src.indexOf(',');return p<0?src.length:Math.ceil((src.length-p-1)*3/4)}
async function compressForPublic(src,maxPx,quality){if(!src||!src.startsWith('data:image/'))return src;try{let img=await loadImg(src),scale=Math.min(1,maxPx/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let png=c.toDataURL('image/png'),webp=c.toDataURL('image/webp',quality),best=dataBytes(webp)<dataBytes(png)?webp:png;return dataBytes(best)<dataBytes(src)?best:src}catch(e){return src}}
function publicExt(src){return String(src).startsWith('data:image/webp')?'webp':'png'}function mb(n){return(n/1048576).toFixed(2)+' MB'}
async function exportPublic(){let btn=document.getElementById('publicExportBtn'),status=document.getElementById('exportStatus');btn.disabled=true;btn.textContent='圧縮中…';status.textContent='公開画像を軽量化しています。';try{let before=dataBytes(state.settings.bgImage),items=[];for(let x of state.items.filter(x=>x.public)){before+=dataBytes(x.main)+dataBytes(x.sample);let main=await compressForPublic(x.main,1600,.9),sample=await compressForPublic(x.sample,1400,.8);items.push({name:x.name,main,sample,save:!!x.save,sampleSave:!!x.sampleSave})}let bgImage=await compressForPublic(state.settings.bgImage,1600,.78),pub={settings:{pageTitle:state.settings.pageTitle,bgColor:state.settings.bgColor,bgImage,bgMode:state.settings.bgMode,updated:state.settings.updated},items},data=JSON.stringify(pub).replace(/</g,'\\u003c'),html=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(pub.settings.pageTitle)}</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17334a}.preview{min-height:100vh;padding:24px;background-position:center;background-attachment:fixed}.gallery{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 18px #0001;text-align:center}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{border:1px solid #cfe8f7;background:#fff;border-radius:999px;padding:9px 13px;font:inherit;cursor:pointer;text-decoration:none;color:#17334a}.primary{background:#168ad5;color:white}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px}.modal.on{display:grid}.box{background:#fff;padding:15px;border-radius:18px;text-align:center;max-width:700px}.box img{max-width:90vw;max-height:70vh}.copyright{text-align:center;font-size:10px;color:#789;padding:24px 8px}</style></head><body><div id="root"></div><div id="m" class="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="box"><h2 id="mt"></h2><img id="mi"><div id="ms"></div><br><button class="pill" onclick="m.classList.remove('on')">閉じる</button></div></div><script>const S=${data};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ext=s=>String(s).startsWith('data:image/webp')?'webp':'png';let a=S.settings,bg=a.bgImage?'url('+a.bgImage+')':'';root.innerHTML='<div class="preview" style="background-color:'+a.bgColor+';background-image:'+bg+';background-size:'+(a.bgMode==='repeat'?'auto':a.bgMode)+';background-repeat:'+(a.bgMode==='repeat'?'repeat':'no-repeat')+'"><h1 style="text-align:center">'+esc(a.pageTitle)+'</h1><div class="gallery">'+S.items.map((x,i)=>'<div class="card"><img src="'+x.main+'"><h3>'+esc(x.name)+'</h3><div class="row">'+(x.sample?'<button class="pill" onclick="sample('+i+')">見本を見る</button>':'')+(x.save?'<a class="pill primary" download="'+esc(x.name)+'.'+ext(x.main)+'" href="'+x.main+'">ぬりえを保存</a>':'')+'</div></div>').join('')+'</div><div class="copyright">© MARINE TRICK</div></div>';function sample(i){let x=S.items[i];mt.textContent=x.name+' 見本';mi.src=x.sample;ms.innerHTML=x.sampleSave?'<a class="pill primary" download="'+esc(x.name)+'_見本.'+ext(x.sample)+'" href="'+x.sample+'">見本を保存</a>':'';m.classList.add('on')}<\/script></body></html>`,after=new Blob([html]).size;download('index.html',html,'text/html');status.textContent='書き出しました：画像 '+mb(before)+' → HTML '+mb(after)+(after>25*1048576?'（25MB超：GitHubブラウザ投稿不可）':'')}catch(e){console.error(e);status.textContent='書き出しに失敗しました。';alert('圧縮版HTMLを書き出せませんでした。')}finally{btn.disabled=false;btn.textContent='圧縮版index.html書き出し'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.v).classList.add('on')});load();
</script></body></html>
