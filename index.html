<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARINE COLORING</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#17334a;background:#eef9ff}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #cce5f5;border-radius:22px;background:white;padding:9px 13px;color:inherit}.primary{background:#168ad5;color:white}.wrap{max-width:1100px;margin:auto;padding:16px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:white;border-radius:18px;padding:14px;text-align:center;box-shadow:0 3px 15px #0001}.card img{width:100%;aspect-ratio:1;object-fit:contain}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.panel{background:#fff;border-radius:18px;padding:14px}.stage{position:relative;width:min(100%,780px);margin:auto;background:white;box-shadow:0 3px 18px #0002;touch-action:none;overflow:hidden}.stage canvas{display:block;width:100%;height:auto;touch-action:none;transform-origin:0 0;will-change:transform}.stage .selectionLayer{position:absolute;left:0;top:0;pointer-events:none}.color{width:38px;height:38px;border-radius:50%;padding:0;border:2px solid #888}.color.on{outline:3px solid #168ad5;outline-offset:2px}.muted{font-size:12px;color:#678}.hidden{display:none!important}@media print{body{background:white}.controls,header,footer{display:none!important}.wrap{padding:0}.panel{padding:0}.stage{width:100%;box-shadow:none;max-height:95vh}.stage canvas{max-height:95vh;object-fit:contain;transform:none!important}.selectionLayer{display:none!important}}
</style></head><body><div class="wrap"><header><h1 id="title"></h1></header><div id="sortBar" class="row"><label>並び順 <select id="sortOrder" onchange="renderGallery()"><option value="registered">登録順</option><option value="name">名前順</option><option value="newest">新しい順</option></select></label></div><div id="gallery" class="gallery"></div><div id="workspace" class="hidden"><div class="controls panel"><div class="row"><button onclick="back()">← 一覧</button><b id="workTitle"></b><span id="saveInfo" class="muted"></span></div><div id="start" class="row"><button onclick="startWork('blank')">白紙から</button><button onclick="startWork('color')">色を変えて遊ぶ</button><select id="material"><option value="normal">ノーマル</option><option value="pencil">色鉛筆</option><option value="crayon">クレヨン</option><option value="water">水彩</option></select><button id="resume" class="hidden" onclick="resumeWork()">つづきから</button></div><div id="tools" class="hidden"><div id="palette" class="row"></div><div class="row"><label>自由色 <input id="custom" type="color" value="#ef5287" onchange="chooseColor(this.value)"></label><label>太さ <select id="size"><option value="6">細</option><option value="14" selected>中</option><option value="28">太</option></select></label><button id="eraser" onclick="eraseMode=!eraseMode;this.classList.toggle('primary',eraseMode)">消しゴム</button><button onclick="undo()">↶ 戻る</button><button onclick="redo()">↷ 進む</button><button onclick="clearSelection()">選択解除</button><button onclick="resetView()">表示を戻す <span id="zoomLabel">100%</span></button><button onclick="showSample()">お手本</button><button onclick="downloadPNG()">PNG保存</button><button onclick="window.print()">印刷</button><button onclick="printBlank()">線画を印刷</button><button onclick="resetWork()">最初から</button></div><small class="muted">長押しで範囲を選択・2本指で拡大や移動</small></div><div id="stage" class="stage hidden"><canvas id="canvas"></canvas><canvas id="selectionCanvas" class="selectionLayer"></canvas></div></div><footer class="muted" style="text-align:center;padding:25px">© MARINE TRICK</footer></div><script>
const S={"settings":{"pageTitle":"マリントリック ぬりえ","bgColor":"#eef9ff","bgMode":"cover","updated":"2026/9/28 23:46:29","bgImage":""},"items":[{"id":"","name":"お月見","createdAt":1,"main":"assets/お月見-original.webp","edge":"assets/お月見-boundary.webp","sample":"assets/お月見-sample.webp","save":true,"sampleSave":false},{"id":"","name":"水遊び","createdAt":2,"main":"assets/水遊び-original.webp","edge":"assets/水遊び-boundary.webp","sample":"assets/水遊び-sample.webp","save":true,"sampleSave":false},{"id":"","name":"なかよし３人組","createdAt":3,"main":"assets/3-original.webp","edge":"assets/3-boundary.webp","sample":"assets/3-sample.webp","save":true,"sampleSave":false},{"id":"Pharmarine","name":"ファマリン","createdAt":4,"main":"assets/Pharmarine-original.webp","edge":"assets/Pharmarine-boundary.webp","sample":"","save":true,"sampleSave":false}]};let item=null,index=-1,original=null,lines=null,paint=null,paintCtx=null,mask=null,region=null,color='#ee527d',eraseMode=false,mode='blank',drawing=false,last=null,history=[],future=[],saveTimer=null;
const $=id=>document.getElementById(id),safe=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const colors=['#ee527d','#f06432','#ffd338','#51b878','#39a9df','#7555b7','#a85a33','#202b40','#ffffff'];
$('title').textContent=S.settings.pageTitle||'マリンぬりえ';document.body.style.backgroundColor=S.settings.bgColor||'#eef9ff';if(S.settings.bgImage)document.body.style.backgroundImage='url('+S.settings.bgImage+')';
function renderGallery(){let sort=$('sortOrder').value,entries=S.items.map((x,i)=>({x,i}));if(sort==='name')entries.sort((a,b)=>a.x.name.localeCompare(b.x.name,'ja')||a.i-b.i);else if(sort==='newest')entries.sort((a,b)=>(b.x.createdAt||b.i+1)-(a.x.createdAt||a.i+1)||a.i-b.i);$('gallery').innerHTML=entries.map(({x,i})=>'<div class="card"><img src="'+x.main+'"><h3>'+safe(x.name)+'</h3><button class="primary" onclick="openWork('+i+')">ぬってあそぶ</button></div>').join('')}renderGallery();
$('palette').innerHTML=colors.map(c=>'<button type="button" class="color" style="background:'+c+'" data-color="'+c+'" onclick="chooseColor(this.dataset.color)" aria-label="色 '+c+'"></button>').join('');chooseColor(color);
function chooseColor(c){color=c;document.querySelectorAll('.color').forEach(b=>b.classList.toggle('on',b.dataset.color===c));eraseMode=false;$('eraser').classList.remove('primary')}
function key(){return 'marineColoring_work_v2_'+(item.id||item.name)}
function readSaved(){try{return JSON.parse(localStorage.getItem(key()))}catch(e){return null}}
function store(){if(!item||!paint)return;try{localStorage.setItem(key(),JSON.stringify({mode,material:$('material').value,paint:paint.toDataURL('image/png')}));$('saveInfo').textContent='途中保存済み'}catch(e){$('saveInfo').textContent='端末の保存容量が足りません。PNG保存をご利用ください'}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(store,700)}
function loadImage(src){return new Promise((ok,no)=>{let im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src=src})}
async function openWork(i){index=i;item=S.items[i];$('workTitle').textContent=item.name;$('gallery').classList.add('hidden');$('sortBar').classList.add('hidden');$('workspace').classList.remove('hidden');$('start').classList.remove('hidden');$('tools').classList.add('hidden');$('stage').classList.add('hidden');$('resume').classList.toggle('hidden',!readSaved());$('saveInfo').textContent='';resetView();original=await loadImage(item.main);let w=original.naturalWidth,h=original.naturalHeight;$('canvas').width=w;$('canvas').height=h;$('selectionCanvas').width=w;$('selectionCanvas').height=h;clearSelection();paint=document.createElement('canvas');paint.width=w;paint.height=h;paintCtx=paint.getContext('2d',{willReadFrequently:true});lines=document.createElement('canvas');lines.width=w;lines.height=h;let lc=lines.getContext('2d',{willReadFrequently:true});if(item.edge){lc.drawImage(await loadImage(item.edge),0,0,w,h)}else{let src=document.createElement('canvas');src.width=w;src.height=h;let g=src.getContext('2d',{willReadFrequently:true});g.drawImage(original,0,0);let a=g.getImageData(0,0,w,h).data,o=lc.createImageData(w,h);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let k=(y*w+x)*4,v=.21*a[k]+.72*a[k+1]+.07*a[k+2],j=k-4,side=.21*a[j]+.72*a[j+1]+.07*a[j+2];if(a[k+3]>40&&(v<92||v<side-65)){o.data[k+3]=255}}lc.putImageData(o,0,0)}let ld=lc.getImageData(0,0,w,h).data;mask=new Uint8Array(w*h);for(let i=0;i<mask.length;i++)mask[i]=ld[i*4+3]>100?1:0;region=null}
function back(){clearSelection();store();$('workspace').classList.add('hidden');$('gallery').classList.remove('hidden');$('sortBar').classList.remove('hidden');item=null}
function startWork(m){mode=m;paintCtx.clearRect(0,0,paint.width,paint.height);history=[];future=[];showEditor();render();scheduleSave()}
async function resumeWork(){let d=readSaved();if(!d)return;mode=d.mode;$('material').value=d.material;paintCtx.clearRect(0,0,paint.width,paint.height);if(d.paint)paintCtx.drawImage(await loadImage(d.paint),0,0);history=[];future=[];showEditor();render()}
function showEditor(){$('start').classList.add('hidden');$('tools').classList.remove('hidden');$('stage').classList.remove('hidden')}
function snapshot(){history.push(paint.toDataURL('image/png'));if(history.length>18)history.shift();future=[]}
async function restore(src){paintCtx.clearRect(0,0,paint.width,paint.height);if(src)paintCtx.drawImage(await loadImage(src),0,0);render();scheduleSave()}
function undo(){if(!history.length)return;future.push(paint.toDataURL('image/png'));restore(history.pop())}function redo(){if(!future.length)return;history.push(paint.toDataURL('image/png'));restore(future.pop())}
function point(e){let r=$('canvas').getBoundingClientRect();return{x:Math.max(0,Math.min(paint.width-1,Math.floor((e.clientX-r.left)*paint.width/r.width))),y:Math.max(0,Math.min(paint.height-1,Math.floor((e.clientY-r.top)*paint.height/r.height)))}}
// Flood from the initial touch: the same visible line image is the brush boundary.
function flood(p){let w=paint.width,h=paint.height,start=p.y*w+p.x;if(mask[start])return null;let seen=new Uint8Array(w*h),queue=new Int32Array(w*h),n=0,head=0;queue[n++]=start;seen[start]=1;while(head<n){let k=queue[head++],x=k%w;if(x>0&& !seen[k-1]&&!mask[k-1])seen[queue[n++]=k-1]=1;if(x<w-1&&!seen[k+1]&&!mask[k+1])seen[queue[n++]=k+1]=1;if(k>=w&&!seen[k-w]&&!mask[k-w])seen[queue[n++]=k-w]=1;if(k<w*(h-1)&&!seen[k+w]&&!mask[k+w])seen[queue[n++]=k+w]=1}return seen}
const can=$('canvas'),selectionCanvas=$('selectionCanvas'),stage=$('stage'),pointers=new Map();let selectedRegion=null,longPressTimer=null;let viewScale=1,viewX=0,viewY=0,paintPointer=null,pendingPoint=null,gesture=null,gestureActive=false;
function applyView(){can.style.transform='translate('+viewX+'px,'+viewY+'px) scale('+viewScale+')';selectionCanvas.style.transform=can.style.transform;$('zoomLabel').textContent=Math.round(viewScale*100)+'%'}
function resetView(){viewScale=1;viewX=0;viewY=0;applyView()}
function zoomAt(next,cx,cy){let r=stage.getBoundingClientRect(),x=cx-r.left,y=cy-r.top,k=Math.max(1,Math.min(5,next));viewX=x-(x-viewX)*k/viewScale;viewY=y-(y-viewY)*k/viewScale;viewScale=k;applyView()}
function clearSelection(){selectedRegion=null;let g=selectionCanvas.getContext('2d');g.clearRect(0,0,selectionCanvas.width,selectionCanvas.height)}
function selectAt(p){let region=flood(p);if(!region)return;selectedRegion=region;let w=paint.width,h=paint.height,g=selectionCanvas.getContext('2d'),img=g.createImageData(w,h),d=img.data;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=y*w+x;if(!region[i])continue;if(region[i-1]&&region[i+1]&&region[i-w]&&region[i+w])continue;for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){let k=((y+dy)*w+x+dx)*4,black=(x+y)%12<6;d[k]=d[k+1]=d[k+2]=black?20:255;d[k+3]=255}}g.putImageData(img,0,0)}
function cancelLongPress(){clearTimeout(longPressTimer);longPressTimer=null}
function beginStroke(p){if(selectedRegion&&!selectedRegion[p.y*paint.width+p.x])return;snapshot();region=selectedRegion||flood(p);if(!region)return;drawing=true;last=p;dab(p);render()}
function moveStroke(p){let dx=p.x-last.x,dy=p.y-last.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/3));for(let i=1;i<=n;i++)dab({x:Math.round(last.x+dx*i/n),y:Math.round(last.y+dy*i/n)});last=p;render()}
function gesturePair(){let a=[...pointers.values()];return{cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,d:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y))}}
stage.addEventListener('pointerdown',e=>{if(!paint||$('stage').classList.contains('hidden'))return;if(e.target!==can&&!pointers.size)return;e.preventDefault();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){cancelLongPress();gestureActive=true;paintPointer=null;pendingPoint=null;if(drawing){drawing=false;region=null;scheduleSave()}let g=gesturePair(),r=stage.getBoundingClientRect();gesture={...g,scale:viewScale,anchorX:(g.cx-r.left-viewX)/viewScale,anchorY:(g.cy-r.top-viewY)/viewScale};return}if(pointers.size!==1||gestureActive)return;paintPointer=e.pointerId;let p=point(e);if(e.pointerType==='touch'){pendingPoint={p,x:e.clientX,y:e.clientY};cancelLongPress();longPressTimer=setTimeout(()=>{if(pointers.size===1&&paintPointer===e.pointerId&&pendingPoint){selectAt(p);pendingPoint=null;paintPointer=null}},550)}else beginStroke(p)});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&gesture){let q=gesturePair(),r=stage.getBoundingClientRect();viewScale=Math.max(1,Math.min(5,gesture.scale*q.d/gesture.d));viewX=q.cx-r.left-gesture.anchorX*viewScale;viewY=q.cy-r.top-gesture.anchorY*viewScale;applyView();return}if(gestureActive||e.pointerId!==paintPointer)return;if(pendingPoint){let moved=Math.hypot(e.clientX-pendingPoint.x,e.clientY-pendingPoint.y);if(moved<4)return;if(moved>8)cancelLongPress();beginStroke(pendingPoint.p);pendingPoint=null}if(drawing)moveStroke(point(e))});
function finishPointer(e){if(!pointers.has(e.pointerId))return;e.preventDefault();cancelLongPress();if(e.pointerId===paintPointer&&!gestureActive){if(pendingPoint){beginStroke(pendingPoint.p);pendingPoint=null}if(drawing){drawing=false;region=null;scheduleSave()}}pointers.delete(e.pointerId);paintPointer=null;if(pointers.size<2)gesture=null;if(!pointers.size)gestureActive=false}
stage.addEventListener('pointerup',finishPointer);stage.addEventListener('pointercancel',finishPointer);
stage.addEventListener('wheel',e=>{if(!paint)return;e.preventDefault();zoomAt(viewScale*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY)},{passive:false});
function dab(p){let w=paint.width,h=paint.height,r=+$('size').value*w/700,material=$('material').value,rad=Math.max(2,r),cx=p.x,cy=p.y;let left=Math.max(0,Math.floor(cx-rad-2)),top=Math.max(0,Math.floor(cy-rad-2)),right=Math.min(w,Math.ceil(cx+rad+3)),bottom=Math.min(h,Math.ceil(cy+rad+3)),bw=right-left,bh=bottom-top;if(!bw||!bh)return;let img=paintCtx.getImageData(left,top,bw,bh),d=img.data,hex=color.replace('#',''),rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));for(let y=top;y<bottom;y++)for(let x=left;x<right;x++){let dx=x-cx,dy=y-cy,dist=Math.hypot(dx,dy);if(dist>rad)continue;let pos=y*w+x;if(mask[pos]||region&&!region[pos])continue;let k=((y-top)*bw+x-left)*4;if(eraseMode){d[k+3]=0;continue}let hash=((x*37+y*101+x*y*3)%97)/97,edge=dist/rad,alpha=material==='normal'?1:material==='pencil'?(.08+.18*hash):material==='crayon'?(hash<.18?0:.34+.35*hash):(.08+.17*(1-edge));let old=d[k+3]/255,newAlpha=alpha+old*(1-alpha);for(let z=0;z<3;z++)d[k+z]=Math.round((rgb[z]*alpha+d[k+z]*old*(1-alpha))/newAlpha);d[k+3]=Math.round(newAlpha*255)}paintCtx.putImageData(img,left,top)}
function render(blankOnly=false){if(!paint)return;let w=paint.width,h=paint.height,c=can.getContext('2d');c.clearRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,0,w,h);if(mode==='color'&&!blankOnly)c.drawImage(original,0,0);if(!blankOnly){let base=document.createElement('canvas');base.width=w;base.height=h;let g=base.getContext('2d',{willReadFrequently:true});g.drawImage(original,0,0);let src=g.getImageData(0,0,w,h).data,pd=paintCtx.getImageData(0,0,w,h).data,out=g.createImageData(w,h);for(let i=0;i<w*h;i++){let j=i*4;if(!pd[j+3]||mask[i])continue;let lum=(.2126*src[j]+.7152*src[j+1]+.0722*src[j+2])/255;let shade=.48+.72*lum;for(let z=0;z<3;z++)out.data[j+z]=Math.min(255,Math.round(pd[j+z]*shade));out.data[j+3]=pd[j+3]}g.putImageData(out,0,0);c.drawImage(base,0,0)}c.drawImage(lines,0,0)}
function downloadPNG(){render();can.toBlob(b=>{if(!b)return;let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(item.id||item.name)+'_coloring.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)},'image/png')}
function printBlank(){render(true);window.print();setTimeout(()=>render(),1500)}function showSample(){let w=window.open('','_blank');if(!w)return;let img=item.sample||item.main;w.document.body.innerHTML='<img style="max-width:100%;max-height:95vh" src="'+img+'">'}function resetWork(){if(!confirm('この作品を最初からやり直しますか？'))return;clearSelection();localStorage.removeItem(key());$('start').classList.remove('hidden');$('tools').classList.add('hidden');$('stage').classList.add('hidden');$('resume').classList.add('hidden')}
</script></body></html>
